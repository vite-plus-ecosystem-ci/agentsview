name: Desktop Artifacts

# Use the test branch workflow and GitHub-hosted runners for ecosystem CI.
on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'frontend/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/desktop-artifacts.yml'
      - '.github/actions/build-desktop-artifact/**'
      - '.github/workflows/desktop-artifacts-pr.yml'
permissions: read-all

jobs:
  run:
    uses: ./.github/workflows/desktop-artifacts.yml
